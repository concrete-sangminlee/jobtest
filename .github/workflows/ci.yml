name: Tests
on:
  push:
    paths-ignore: [seen_jobs.json]
  pull_request:
    paths-ignore: [seen_jobs.json]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_google_bridge.cjs
