name: Check hibrain.net Job Postings

on:
  schedule:
    # 하루 3회 (KST 기준) — GitHub Actions cron은 UTC 기준.
    # 정각(:00)은 큐가 붐벼 지연이 크므로 :07로 살짝 비켜 예약.
    - cron: "7 0 * * *"  # 09:07 KST
    - cron: "7 5 * * *"  # 14:07 KST
    - cron: "7 10 * * *" # 19:07 KST
  workflow_dispatch:
    inputs:
      test_mode:
        description: "테스트 모드 (샘플 공고를 Slack 전송)"
        type: boolean
        default: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: python scraper.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen_jobs.json"
          git push
