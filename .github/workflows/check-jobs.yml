name: Check hibrain.net Job Postings

on:
  schedule:
    # 하루 3회 (KST 기준) — GitHub Actions cron은 UTC 기준.
    # 정각(:00)은 큐가 붐벼 지연이 크므로 :07로 살짝 비켜 예약.
    - cron: "7 0 * * *"  # 09:07 KST
    - cron: "7 5 * * *"  # 14:07 KST
    - cron: "7 10 * * *" # 19:07 KST
  workflow_dispatch:
    inputs:
      test_mode:
        description: "테스트 모드 (샘플 공고를 Slack 전송)"
        type: boolean
        default: false

# 두 실행이 겹치면 상태 파일 커밋이 서로 밀어낸다. 한 번에 하나만 돌린다.
concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          TEST_MODE: ${{ inputs.test_mode }}
          # 아래는 모두 선택 사항. 저장소 Variables에서 코드 수정 없이 조절한다.
          # (Settings → Secrets and variables → Actions → Variables)
          REMINDER_DAYS: ${{ vars.REMINDER_DAYS }}            # 예: "3,1" — 비우면 리마인더 꺼짐
          JOB_INCLUDE_KEYWORDS: ${{ vars.JOB_INCLUDE_KEYWORDS }}
          JOB_EXCLUDE_KEYWORDS: ${{ vars.JOB_EXCLUDE_KEYWORDS }}
          ENRICH: ${{ vars.ENRICH }}                          # "false"로 상세 보강 끄기
          JOBS_PER_MESSAGE: ${{ vars.JOBS_PER_MESSAGE }}
          MAX_MESSAGES: ${{ vars.MAX_MESSAGES }}
        run: python scraper.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add seen_jobs.json
          if [ -f tracked_jobs.json ]; then git add tracked_jobs.json; fi

          if git diff --staged --quiet; then
            echo "상태 변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "Update job state"

          # 다른 실행이 먼저 푸시했을 수 있으니 리베이스 후 재시도한다.
          for attempt in 1 2 3; do
            if git push; then
              echo "푸시 완료 (시도 $attempt)"
              exit 0
            fi
            echo "푸시 실패 — 원격 변경을 가져와 리베이스 후 재시도 ($attempt/3)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 3))
          done

          echo "::error::상태 파일을 푸시하지 못했습니다. 다음 실행에서 공고가 중복 알림될 수 있습니다."
          exit 1
